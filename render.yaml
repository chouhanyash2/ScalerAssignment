services:
  - type: web
    name: pii-redaction-tool
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # upgrade to starter ($7/mo) for always-on
    healthCheckPath: /api/status
    autoDeploy: true    # auto-redeploy on every push to main
    envVars:
      - key: PORT
        value: 8000
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1         # ensures logs appear in real-time in Render dashboard
      - key: PYTHONDONTWRITEBYTECODE
        value: 1         # no .pyc files in container
